server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: restaurant-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/restaurantdb}
    username: ${SPRING_DATASOURCE_USERNAME:restaurant}
    password: ${SPRING_DATASOURCE_PASSWORD:restaurant}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:}]"
